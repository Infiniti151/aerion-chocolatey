name: Daily Update & Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.compare-versions.outputs.should_run }}
      upstream_version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Checkout aerion.nuspec
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            aerion/aerion.nuspec

      - name: Fetch Latest Upstream Version
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_VERSION=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/hkdb/aerion/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Local Main Nuspec Version
        id: local
        run: |
          LOCAL_VERSION=$(grep -oP '(?<=<version>).*?(?=</version>)' aerion/aerion.nuspec | head -n 1)
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

      - name: Compare Versions
        id: compare-versions
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          LOCAL: ${{ steps.local.outputs.version }}
          CYAN: '\033[0;36m'
          GREEN: '\033[0;32m'
          YELLOW: '\033[0;33m'
          NC: '\033[0m'
        run: |
          echo -e "${CYAN}Upstream release version: $UPSTREAM${NC}"
          echo -e "${CYAN}Local repository version: $LOCAL${NC}"
          
          if [ "$UPSTREAM" != "$LOCAL" ]; then
            echo -e "${GREEN}New release detected upstream! Triggering packaging pipeline.${NC}"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo -e "${YELLOW}No new updates found. Sleeping pipeline.${NC}"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: ${{ needs.check-release.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Package Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Native Update Engine Script
        env:
          UPSTREAM_VERSION: ${{ needs.check-release.outputs.upstream_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\updateall.ps1

      - name: Commit version bump via GitHub API
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        id: ghcommit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: "🤖 Automated version bump to v${{ needs.check-release.outputs.upstream_version }}"
          fail_on_self_push: false

      - name: Attest Chocolatey Packages (SLSA Provenance)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: out/*.nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: "v${{ needs.check-release.outputs.upstream_version }}"
          name: "v${{ needs.check-release.outputs.upstream_version }}"
          files: out/*.nupkg
          body: |
            ## Aerion Chocolatey Package `v${{ needs.check-release.outputs.upstream_version }}`

            This is an automated tracking release providing the latest compiled Chocolatey package for **Aerion**.

      - name: Push to Public Chocolatey Feed Directory
        run: |
          Write-Host "Publishing compiled payloads to the public Chocolatey Community Feed..." -ForegroundColor Cyan
          
          Get-ChildItem out/*.nupkg | ForEach-Object {
              Write-Host "🚀 Pushing package: $($_.Name)" -ForegroundColor Yellow
              
              choco push $_.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCO_API_KEY }}
              
              if ($LASTEXITCODE -ne 0) {
                  Write-Output "::error title=Chocolatey Push Failed::Failed to push package '$($_.Name)'. Terminating deployment pipeline."
                  exit 1
              }
          }

          Write-Host "✅ All Chocolatey packages pushed successfully!" -ForegroundColor Green
